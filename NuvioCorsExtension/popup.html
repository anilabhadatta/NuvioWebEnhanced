<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvio CORS Unlocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="Nuvio" class="logo" width="28" height="28">
        <div class="brand-text">
          <span class="title">Nuvio</span>
          <span class="subtitle">CORS Unlocker</span>
        </div>
      </div>
      <span class="version-tag">v1.0.0</span>
    </header>

    <!-- Status Card -->
    <div class="card status-card">
      <div class="status-left">
        <span class="status-dot" id="statusDot"></span>
        <div class="status-info">
          <span class="status-label" id="statusText">Active &amp; Ready</span>
          <span class="status-detail" id="statusSubtext">CORS headers unlocked</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleRules" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Supported Browsers Badge Row -->
    <div class="card browsers-card">
      <span class="card-label">Supported Browsers</span>
      <div class="browser-pills">
        <div class="pill active">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
          </svg>
          Chrome
        </div>
        <div class="pill active">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
          </svg>
          Brave
        </div>
        <div class="pill active">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor">
            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
          </svg>
          Edge
        </div>
      </div>
    </div>

    <!-- Description -->
    <p class="desc">
      Enables direct streaming and WebCodecs hardware decoding for TorBox, Real-Debrid, and video CDN streams without server proxying.
    </p>

    <!-- Footer Action -->
    <div class="footer">
      <button id="openAppBtn" class="btn-primary">
        Open Nuvio Web
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
